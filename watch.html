<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta name="description" content="Hindi Anime - Watch Anime Online, Free Hindi Dub Anime Only At Anicreator.in">
    <meta name="keywords" content="Hindi Anime, Hindi Dub, Watch Anime Online, Free Anime, Anicreator">

    <title>Watch - Anicreator</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/jpeg"
        href="/channels4_profile.jpg"
    >

    <link

        href="/channels4_profile.jpg"
    >

<link
            rel="stylesheet"
            href="css/style.css"
        >

        <script type="importmap">
            {"imports":{"@websim/websim-socket":"https://esm.websim.com/@websim/websim-socket"}}
        </script>


</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

    <a
        class="logo"
        href="index.html"
    >
        <img class="logo-img" src="/channels4_profile.jpg" alt="">
        Anicreator
    </a>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="anime.html">
            Anime
        </a>

        <a href="movie.html">
            Movie
        </a>

        <a href="bookmark.html">
            Bookmarks
        </a>

        <a href="history.html">
            History
        </a>

    </nav>

    <div class="search-box"><input id="globalSearch" class="search" placeholder="Search..."><button id="searchBtn" class="search-btn" aria-label="Search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></button></div>

</header>


<!-- ==========================================
     MAIN
========================================== -->

<main class="container">

    <div
        id="loading"
        class="state"
    >
        Loading...
    </div>

    <div
        id="error"
        class="state error"
    ></div>


    <div
        id="page"
        class="hidden"
    >


        <!-- ======================================
             VIDEO PLAYER + WATERMARK
        ======================================= -->

        <div class="container player-container">

            <div
                class="anime-video-wrapper"
                id="anime-video-wrapper"
            >

                <iframe
                    allow="autoplay; encrypted-media"
                    allowfullscreen
                    scrolling="no"
                    id="anime-video-frame"
                ></iframe>


                <!-- WATERMARK BACKGROUND -->

                <img
                    class="watermark-background-image"
                    src="/transparent-image.png"
                    alt=""
                >


                <!-- ANICREATOR WATERMARK -->

                <img
                    class="watermark-image"
                    src="/channels4_profile.jpg"
                    alt="AniCreator"
                >

            </div>

        </div>


        <!-- ======================================
             BACK
        ======================================= -->

        <a
            id="back"
            class="back"
            href="#"
        >
            ← Back
        </a>


        <!-- ======================================
             TITLE / NAVIGATION
        ======================================= -->

        <div class="watch-head">

            <div>

                <h1 id="title"></h1>

                <p id="meta"></p>

            </div>


            <div id="watchTools" class="watch-tools">

                <button
                    id="bookmarkBtn"
                    class="btn bookmark-btn"
                >
                    ☆ Save
                </button>

                <button
                    id="shareBtn"
                    class="btn"
                >
                    ↗ Share
                </button>

            </div>

            <div id="actions">

                <button id="prev">
                    ← Previous
                </button>

                <button id="next">
                    Next →
                </button>

            </div>

        </div>


        <!-- ======================================
             SUB / DUB
        ======================================= -->

        <div
            id="tabs"
            class="tabs"
        >

            <button
                class="lang active"
                data-lang="sub"
            >
                SUB
            </button>

            <button
                class="lang"
                data-lang="dub"
            >
                DUB
            </button>

        </div>


        <!-- ======================================
             EPISODES
        ======================================= -->

        <h2 id="episodeHeading">
            Episodes
        </h2>

        <div
            id="episodes"
            class="episode-grid"
        ></div>


    </div>

</main>


<!-- ==========================================
     FOOTER
========================================== -->

<footer>

    Anicreator does not store any files on our server, we only linked to the media which is hosted on 3rd party services. &copy; 2025 Anicreator.in. All rights reserved.

</footer>


<script>

/* ==========================================
   HELPERS
========================================== */

const $ = selector =>
    document.querySelector(selector);


const params =
    new URLSearchParams(
        window.location.search
    );


const animeKey =
    params.get("anime");


const seasonNumber =
    Number(
        params.get("season") || 1
    );


const episodeNumber =
    Number(
        params.get("ep") || 1
    );


let anime = null;

let season = null;

let episodes = [];

let currentIndex = 0;

let language = "sub";


/* ==========================================
   HTML ESCAPE
========================================== */

function esc(value) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        function(character) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[character];

        }
    );

}


/* ==========================================
   ERROR
========================================== */

function showError(message) {

    $("#loading")
        .classList
        .add("hidden");

    $("#error")
        .textContent =
        message;

}


/* ==========================================
   EPISODE URL
========================================== */

function episodeLink(episode) {

    return (
        "watch.html" +

        "?anime=" +
        encodeURIComponent(
            anime.slug ||
            anime.id
        ) +

        "&season=" +
        encodeURIComponent(
            season.season_number
        ) +

        "&ep=" +
        encodeURIComponent(
            episode.episode_number
        )
    );

}


/* ==========================================
   RENDER PLAYER
========================================== */

function renderPlayer() {

    const episode =
        episodes[currentIndex];


    if (!episode) {

        showError(
            "Episode not found."
        );

        return;

    }


    const isMovie =
        (
            anime.type ||
            "anime"
        ).toLowerCase() ===
        "movie";


    /* BOOKMARK / HISTORY DATA */

    window.__bookmarkData = {
        anime_slug: anime.slug || anime.id,
        anime_title: anime.title || "",
        season_number: season.season_number,
        episode_number: episode.episode_number,
        title: episode.title || "",
        thumbnail: episode.thumbnail || anime.poster || "",
        type: isMovie ? "movie" : "anime"
    };
    window.dispatchEvent(
        new Event("bookmark-data")
    );


    document.title =
        (
            anime.title ||
            "Watch"
        ) +
        " - Anicreator";


    /* TITLE */

    $("#title")
        .textContent =
        episode.title ||
        (
            isMovie
                ? anime.title
                : "Episode " +
                  episode.episode_number
        );


    /* META */

    $("#meta")
        .textContent =
        isMovie

            ? anime.title

            : anime.title +
              " • Season " +
              season.season_number +
              " • Episode " +
              episode.episode_number;


    /* BACK BUTTON */

    $("#back").href =
        isMovie
            ? "movie.html"
            : "anime.html";


    /* PREVIOUS / NEXT */

    $("#actions")
        .classList
        .toggle(
            "hidden",
            isMovie
        );


    /* SUB / DUB */

    const hasSub =
        Boolean(
            episode.sub_url
        );

    const hasDub =
        Boolean(
            episode.dub_url
        );


    $("#tabs")
        .classList
        .toggle(
            "hidden",
            !hasSub &&
            !hasDub
        );


    /* If requested language doesn't exist,
       automatically use the other one. */

    let videoURL;


    if (
        language === "dub" &&
        hasDub
    ) {

        videoURL =
            episode.dub_url;

    }

    else if (
        language === "sub" &&
        hasSub
    ) {

        videoURL =
            episode.sub_url;

    }

    else if (hasSub) {

        language = "sub";

        videoURL =
            episode.sub_url;

    }

    else if (hasDub) {

        language = "dub";

        videoURL =
            episode.dub_url;

    }

    else {

        videoURL = "";

    }


    /* ======================================
       LOAD VIDEO
    ======================================= */

    const frame =
        $("#anime-video-frame");


    if (videoURL) {

        frame.src =
            videoURL;

        frame.classList
            .remove("hidden");

        $("#empty")
            ?.classList
            .add("hidden");

    }

    else {

        frame.removeAttribute(
            "src"
        );

        frame.classList
            .add("hidden");

    }


    /* ======================================
       LANGUAGE ACTIVE BUTTON
    ======================================= */

    document
        .querySelectorAll(".lang")
        .forEach(
            function(button) {

                button.classList.toggle(
                    "active",
                    button.dataset.lang ===
                    language
                );

            }
        );


    /* ======================================
       PREVIOUS
    ======================================= */

    $("#prev").disabled =
        currentIndex <= 0;


    /* ======================================
       NEXT
    ======================================= */

    $("#next").disabled =
        currentIndex >=
        episodes.length - 1;


    /* ======================================
       EPISODE LIST
    ======================================= */

    if (isMovie) {

        $("#episodes")
            .innerHTML = "";

    }

    else {

        $("#episodes")
            .innerHTML =
            episodes
                .map(
                    function(item, index) {

                        return `

                            <a
                                class="episode ${
                                    index === currentIndex
                                        ? "current"
                                        : ""
                                }"
                                href="${episodeLink(item)}"
                            >

                                <div class="epno">

                                    EP ${
                                        esc(
                                            item.episode_number
                                        )
                                    }

                                </div>

                                <div class="eptitle">

                                    ${
                                        esc(
                                            item.title ||
                                            (
                                                "Episode " +
                                                item.episode_number
                                            )
                                        )
                                    }

                                </div>

                            </a>

                        `;

                    }
                )
                .join("");

    }


    /* ======================================
       SHOW PAGE
    ======================================= */

    $("#loading")
        .classList
        .add("hidden");

    $("#page")
        .classList
        .remove("hidden");

}


/* ==========================================
   MOVE EPISODE
========================================== */

function moveEpisode(direction) {

    const newIndex =
        currentIndex +
        direction;


    if (
        newIndex < 0 ||
        newIndex >= episodes.length
    ) {

        return;

    }


    window.location.href =
        episodeLink(
            episodes[newIndex]
        );

}


/* ==========================================
   PREVIOUS
========================================== */

$("#prev")
    .addEventListener(
        "click",
        function() {

            moveEpisode(-1);

        }
    );


/* ==========================================
   NEXT
========================================== */

$("#next")
    .addEventListener(
        "click",
        function() {

            moveEpisode(1);

        }
    );


/* ==========================================
   SUB / DUB BUTTONS
========================================== */

document
    .querySelectorAll(".lang")
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    language =
                        button.dataset.lang;

                    renderPlayer();

                }
            );

        }
    );



/* ==========================================
   SHARE
========================================= */

$("#shareBtn")
    .addEventListener(
        "click",
        function() {

            const url =
                window.location.href;

            if (
                navigator.share
            ) {

                navigator.share({
                    title: document.title,
                    url: url
                }).catch(function(){});

                return;

            }

            const feedback =
                function() {

                    const btn =
                        $("#shareBtn");
                    const text =
                        btn.textContent;

                    btn.textContent =
                        "Copied!";

                    setTimeout(
                        function() {
                            btn.textContent =
                                text;
                        },
                        1500
                    );

                };

            const fallback =
                function() {

                    const ta =
                        document.createElement(
                            "textarea"
                        );
                    ta.value =
                        url;
                    document.body
                        .appendChild(ta);
                    ta.select();
                    try {
                        document
                            .execCommand("copy");
                    }
                    catch (e) {}
                    ta.remove();
                    feedback();

                };

            if (
                navigator.clipboard
            ) {

                navigator.clipboard
                    .writeText(url)
                    .then(feedback)
                    .catch(fallback);

            }

            else {

                fallback();

            }

        }
    );


/* ==========================================
   KEYBOARD CONTROLS
========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const target =
            event.target;


        if (
            target &&
            (
                target.tagName ===
                    "INPUT" ||

                target.tagName ===
                    "TEXTAREA" ||

                target.tagName ===
                    "SELECT"
            )
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            moveEpisode(-1);

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            moveEpisode(1);

        }

    }
);


/* ==========================================
   LOAD ANIME JSON
========================================== */

async function init() {

    try {

        if (!animeKey) {

            throw new Error(
                "No anime specified."
            );

        }


        const response =
            await fetch(
                "data/anime/" +
                encodeURIComponent(
                    animeKey
                ) +
                ".json",
                {
                    cache:
                        "no-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Anime not found."
            );

        }


        anime =
            await response.json();


        /* ==================================
           FIND SEASON
        ================================== */

        const seasons =
            Array.isArray(
                anime.seasons
            )
                ? anime.seasons
                : [];


        season =
            seasons.find(
                function(item) {

                    return (
                        Number(
                            item.season_number
                        ) ===
                        seasonNumber
                    );

                }
            );


        if (!season) {

            season =
                seasons[0];

        }


        if (!season) {

            throw new Error(
                "Season not found."
            );

        }


        /* ==================================
           LOAD EPISODES
        ================================== */

        episodes =
            Array.isArray(
                season.episodes
            )
                ? [
                    ...season.episodes
                ]
                : [];


        episodes.sort(
            function(a, b) {

                return (
                    Number(
                        a.episode_number
                    ) -
                    Number(
                        b.episode_number
                    )
                );

            }
        );


        if (!episodes.length) {

            throw new Error(
                "No episodes found."
            );

        }


        /* ==================================
           FIND CURRENT EPISODE
        ================================== */

        const foundIndex =
            episodes.findIndex(
                function(item) {

                    return (
                        Number(
                            item.episode_number
                        ) ===
                        episodeNumber
                    );

                }
            );


        currentIndex =
            foundIndex >= 0
                ? foundIndex
                : 0;


        renderPlayer();

    }

    catch (error) {

        showError(
            error.message ||
            "Unable to load video."
        );

    }

}


/* ==========================================
   POPUNDER
========================================== */

let lastPopunderTime = 0;
const popunderCooldown = 60000;

function openPopunder() {
    const videoWrapper = $("#anime-video-wrapper");
    if (videoWrapper && videoWrapper.style.display !== 'none') {
        const currentTime = Date.now();
        if (currentTime - lastPopunderTime >= popunderCooldown) {
            let popunder = window.open('https://omg10.com/4/9277687', '_blank');
            if (popunder) {
                popunder.blur();
                window.focus();
                try { popunder.moveTo(9999, 9999); } catch (e) {}
                lastPopunderTime = currentTime;
            } else {
                lastPopunderTime = currentTime;
            }
        }
    }
}
document.body.addEventListener('click', openPopunder);


/* ==========================================
   START
========================================= */

init();


/* ==========================================
   BOOKMARK
========================================= */

import(
    "./js/bookmark.js"
).then(

    async function({ isBookmarked, toggleBookmark }) {

        const btn =
            $("#bookmarkBtn");

        const history =
            await import(
                "./js/history.js"
            );

        const refresh = async function() {

            const data =
                window.__bookmarkData;

            btn.disabled =
                !data;

            if (!data) {

                return;

            }

            history.addHistory(
                data
            );

            const saved =
                await isBookmarked(
                    data
                );

            btn.classList.toggle(
                "saved",
                saved
            );

            btn.textContent =
                saved
                    ? "★ Saved"
                    : "☆ Save";

        };

        btn.addEventListener(
            "click",
            async function() {

                const data =
                    window.__bookmarkData;

                if (
                    !data ||
                    btn.disabled
                ) {

                    return;

                }

                btn.disabled =
                    true;

                const now =
                    await toggleBookmark(
                        data
                    );

                if (
                    now === null
                ) {

                    btn.disabled =
                        false;

                    return;

                }

                btn.classList.toggle(
                    "saved",
                    now
                );

                btn.textContent =
                    now
                        ? "★ Saved"
                        : "☆ Save";

                btn.disabled =
                    false;

            }
        );

        window.addEventListener(
            "bookmark-data",
            refresh
        );

        refresh();

    }

);

</script>


</body>
