<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Watch - Anicreator</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="/20200620_200442(3).png"
    >

    <link
        rel="apple-touch-icon"
        href="/20200620_200442(3).png"
    >

    <style>

        :root {
            --bg: #08080d;
            --panel: #111119;
            --panel2: #191922;
            --text: #f5f5f7;
            --muted: #9999a8;
            --accent: #8b5cf6;
            --accent2: #a78bfa;
            --border: #292936;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .header {

            height: 64px;

            padding: 0 5%;

            display: flex;

            align-items: center;

            gap: 30px;

            border-bottom:
                1px solid var(--border);

            position: sticky;

            top: 0;

            background:
                rgba(8, 8, 13, 0.92);

            backdrop-filter:
                blur(10px);

            z-index: 100;
        }

        .logo {

            font-size: 23px;

            font-weight: 800;
        }

        .logo span {

            color:
                var(--accent2);
        }

        nav {

            display: flex;

            gap: 20px;

            color:
                var(--muted);
        }

        nav a:hover {

            color: #fff;
        }

        nav a.active {

            color: #fff;
        }


        /* ==========================================
           CONTAINER
        ========================================== */

        .container {

            width:
                min(1200px, 92%);

            margin:
                0 auto;

            padding:
                30px 0 70px;
        }


        /* ==========================================
           PLAYER
        ========================================== */

        .player-container {

            width: 100%;

            padding-top: 25px;
        }

        .anime-video-wrapper {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            overflow: hidden;

            border:
                1px solid var(--border);

            border-radius: 10px;
        }

        .anime-video-wrapper iframe {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            border: 0;

            z-index: 1;
        }


        /* ==========================================
           WATERMARK
        ========================================== */

        .watermark-background-image {

            position: absolute;

            top: 20px;

            right: 0px;

            width: 10%;

            height: 20%;

            border-radius: 5px;

            z-index: 20;

            pointer-events: none;

            object-fit: cover;
        }

        .watermark-image {

            position: absolute;

            top: 12px;

            right: 12px;

            width: 10%;

            height: auto;

            border-radius: 5px;

            opacity: 1;

            z-index: 21;

            pointer-events: none;

            object-fit: contain;
        }


        /* ==========================================
           BACK BUTTON
        ========================================== */

        .back {

            display: inline-block;

            margin-top: 18px;

            color:
                var(--accent2);

            font-size: 14px;
        }

        .back:hover {

            color: #fff;
        }


        /* ==========================================
           WATCH HEADER
        ========================================== */

        .watch-head {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

            padding:
                18px 0;

            border-bottom:
                1px solid var(--border);
        }

        .watch-head h1 {

            margin:
                5px 0;

            font-size: 24px;
        }

        .watch-head p {

            margin: 0;

            color:
                var(--muted);

            font-size: 14px;
        }


        /* ==========================================
           PREV / NEXT
        ========================================== */

        #actions {

            display: flex;

            gap: 8px;
        }

        #actions button {

            padding:
                10px 14px;

            border:
                1px solid var(--border);

            border-radius: 8px;

            background:
                var(--panel2);

            color: #fff;

            cursor: pointer;
        }

        #actions button:hover {

            background:
                var(--accent);

            border-color:
                var(--accent);
        }

        #actions button:disabled {

            opacity: 0.4;

            cursor:
                not-allowed;
        }


        /* ==========================================
           LANGUAGE BUTTONS
        ========================================== */

        .tabs {

            display: flex;

            gap: 7px;

            margin:
                18px 0;
        }

        .lang {

            padding:
                9px 14px;

            border:
                1px solid var(--border);

            border-radius: 8px;

            background:
                var(--panel2);

            color: #fff;

            cursor: pointer;
        }

        .lang:hover {

            border-color:
                var(--accent);
        }

        .lang.active {

            background:
                var(--accent);

            border-color:
                var(--accent);
        }


        /* ==========================================
           EPISODES
        ========================================== */

        #episodeHeading {

            margin-top: 30px;

            margin-bottom: 15px;
        }

        .episode-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(170px, 1fr)
                );

            gap: 10px;
        }

        .episode {

            padding: 13px;

            background:
                var(--panel);

            border:
                1px solid var(--border);

            border-radius: 8px;

            transition:
                0.2s;
        }

        .episode:hover {

            border-color:
                var(--accent);

            transform:
                translateY(-2px);
        }

        .episode.current {

            border-color:
                var(--accent);

            background:
                #171329;
        }

        .epno {

            font-size: 11px;

            color:
                var(--accent2);

            font-weight: bold;
        }

        .eptitle {

            margin-top: 5px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* ==========================================
           LOADING / ERROR
        ========================================== */

        .state {

            text-align: center;

            padding: 55px;

            color:
                var(--muted);
        }

        .error {

            color:
                #ff9191;
        }

        .hidden {

            display: none !important;
        }


        /* ==========================================
           EMPTY PLAYER
        ========================================== */

        .empty {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            color:
                var(--muted);

            background: #000;

            z-index: 5;
        }


        /* ==========================================
           FOOTER
        ========================================== */

        footer {

            text-align: center;

            color: #666;

            border-top:
                1px solid var(--border);

            padding: 25px;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 768px) {

            .header {

                height: 58px;

                padding:
                    0 4%;

                gap: 12px;
            }

            .logo {

                font-size: 19px;
            }

            nav {

                gap: 10px;

                font-size: 13px;
            }

            .container {

                width: 94%;

                padding-top: 15px;
            }

            .player-container {

                width: 100%;

                padding-top: 10px;
            }

            .anime-video-wrapper {

                border-radius: 6px;
            }


            /* MOBILE WATERMARK */

            .watermark-background-image {

                top: 10px;

                right: 0;

                width: 18%;

                height: 20%;
            }

            .watermark-image {

                top: 7px;

                right: 7px;

                width: 18%;
            }


            .watch-head {

                flex-direction: column;

                align-items: stretch;
            }

            .watch-head h1 {

                font-size: 20px;
            }

            #actions {

                width: 100%;
            }

            #actions button {

                flex: 1;
            }

            .episode-grid {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 8px;
            }

        }


        /* ==========================================
           SMALL PHONES
        ========================================== */

        @media (max-width: 450px) {

            .header nav {

                gap: 7px;

                font-size: 12px;
            }

            .episode-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .watermark-background-image {

                width: 20%;

                height: 20%;
            }

            .watermark-image {

                width: 20%;

                right: 5px;

                top: 5px;
            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

    <a
        class="logo"
        href="index.html"
    >
        Ani<span>creator</span>
    </a>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="anime.html">
            Anime
        </a>

        <a href="movie.html">
            Movie
        </a>

    </nav>

</header>


<!-- ==========================================
     MAIN
========================================== -->

<main class="container">

    <div
        id="loading"
        class="state"
    >
        Loading...
    </div>

    <div
        id="error"
        class="state error"
    ></div>


    <div
        id="page"
        class="hidden"
    >


        <!-- ======================================
             VIDEO PLAYER + WATERMARK
        ======================================= -->

        <div class="container player-container">

            <div
                class="anime-video-wrapper"
                id="anime-video-wrapper"
            >

                <iframe
                    allow="autoplay; encrypted-media"
                    allowfullscreen
                    scrolling="no"
                    id="anime-video-frame"
                ></iframe>


                <!-- WATERMARK BACKGROUND -->

                <img
                    class="watermark-background-image"
                    src="/transparent-image.png"
                    alt=""
                >


                <!-- ANICREATOR WATERMARK -->

                <img
                    class="watermark-image"
                    src="/channels4_profile.jpg"
                    alt="AniCreator"
                >

            </div>

        </div>


        <!-- ======================================
             BACK
        ======================================= -->

        <a
            id="back"
            class="back"
            href="#"
        >
            ← Back
        </a>


        <!-- ======================================
             TITLE / NAVIGATION
        ======================================= -->

        <div class="watch-head">

            <div>

                <h1 id="title"></h1>

                <p id="meta"></p>

            </div>


            <div id="actions">

                <button id="prev">
                    ← Previous
                </button>

                <button id="next">
                    Next →
                </button>

            </div>

        </div>


        <!-- ======================================
             SUB / DUB
        ======================================= -->

        <div
            id="tabs"
            class="tabs"
        >

            <button
                class="lang active"
                data-lang="sub"
            >
                SUB
            </button>

            <button
                class="lang"
                data-lang="dub"
            >
                DUB
            </button>

        </div>


        <!-- ======================================
             EPISODES
        ======================================= -->

        <h2 id="episodeHeading">
            Episodes
        </h2>

        <div
            id="episodes"
            class="episode-grid"
        ></div>


    </div>

</main>


<!-- ==========================================
     FOOTER
========================================== -->

<footer>

    © Anicreator

</footer>


<script>

/* ==========================================
   HELPERS
========================================== */

const $ = selector =>
    document.querySelector(selector);


const params =
    new URLSearchParams(
        window.location.search
    );


const animeKey =
    params.get("anime");


const seasonNumber =
    Number(
        params.get("season") || 1
    );


const episodeNumber =
    Number(
        params.get("ep") || 1
    );


let anime = null;

let season = null;

let episodes = [];

let currentIndex = 0;

let language = "sub";


/* ==========================================
   HTML ESCAPE
========================================== */

function esc(value) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        function(character) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[character];

        }
    );

}


/* ==========================================
   ERROR
========================================== */

function showError(message) {

    $("#loading")
        .classList
        .add("hidden");

    $("#error")
        .textContent =
        message;

}


/* ==========================================
   EPISODE URL
========================================== */

function episodeLink(episode) {

    return (
        "watch.html" +

        "?anime=" +
        encodeURIComponent(
            anime.slug ||
            anime.id
        ) +

        "&season=" +
        encodeURIComponent(
            season.season_number
        ) +

        "&ep=" +
        encodeURIComponent(
            episode.episode_number
        )
    );

}


/* ==========================================
   RENDER PLAYER
========================================== */

function renderPlayer() {

    const episode =
        episodes[currentIndex];


    if (!episode) {

        showError(
            "Episode not found."
        );

        return;

    }


    const isMovie =
        (
            anime.type ||
            "anime"
        ).toLowerCase() ===
        "movie";


    document.title =
        (
            anime.title ||
            "Watch"
        ) +
        " - Anicreator";


    /* TITLE */

    $("#title")
        .textContent =
        episode.title ||
        (
            isMovie
                ? anime.title
                : "Episode " +
                  episode.episode_number
        );


    /* META */

    $("#meta")
        .textContent =
        isMovie

            ? anime.title

            : anime.title +
              " • Season " +
              season.season_number +
              " • Episode " +
              episode.episode_number;


    /* BACK BUTTON */

    $("#back").href =
        isMovie
            ? "movie.html"
            : "anime.html";


    /* PREVIOUS / NEXT */

    $("#actions")
        .classList
        .toggle(
            "hidden",
            isMovie
        );


    /* SUB / DUB */

    const hasSub =
        Boolean(
            episode.sub_url
        );

    const hasDub =
        Boolean(
            episode.dub_url
        );


    $("#tabs")
        .classList
        .toggle(
            "hidden",
            !hasSub &&
            !hasDub
        );


    /* If requested language doesn't exist,
       automatically use the other one. */

    let videoURL;


    if (
        language === "dub" &&
        hasDub
    ) {

        videoURL =
            episode.dub_url;

    }

    else if (
        language === "sub" &&
        hasSub
    ) {

        videoURL =
            episode.sub_url;

    }

    else if (hasSub) {

        language = "sub";

        videoURL =
            episode.sub_url;

    }

    else if (hasDub) {

        language = "dub";

        videoURL =
            episode.dub_url;

    }

    else {

        videoURL = "";

    }


    /* ======================================
       LOAD VIDEO
    ======================================= */

    const frame =
        $("#anime-video-frame");


    if (videoURL) {

        frame.src =
            videoURL;

        frame.classList
            .remove("hidden");

        $("#empty")
            ?.classList
            .add("hidden");

    }

    else {

        frame.removeAttribute(
            "src"
        );

        frame.classList
            .add("hidden");

    }


    /* ======================================
       LANGUAGE ACTIVE BUTTON
    ======================================= */

    document
        .querySelectorAll(".lang")
        .forEach(
            function(button) {

                button.classList.toggle(
                    "active",
                    button.dataset.lang ===
                    language
                );

            }
        );


    /* ======================================
       PREVIOUS
    ======================================= */

    $("#prev").disabled =
        currentIndex <= 0;


    /* ======================================
       NEXT
    ======================================= */

    $("#next").disabled =
        currentIndex >=
        episodes.length - 1;


    /* ======================================
       EPISODE LIST
    ======================================= */

    if (isMovie) {

        $("#episodes")
            .innerHTML = "";

    }

    else {

        $("#episodes")
            .innerHTML =
            episodes
                .map(
                    function(item, index) {

                        return `

                            <a
                                class="episode ${
                                    index === currentIndex
                                        ? "current"
                                        : ""
                                }"
                                href="${episodeLink(item)}"
                            >

                                <div class="epno">

                                    EP ${
                                        esc(
                                            item.episode_number
                                        )
                                    }

                                </div>

                                <div class="eptitle">

                                    ${
                                        esc(
                                            item.title ||
                                            (
                                                "Episode " +
                                                item.episode_number
                                            )
                                        )
                                    }

                                </div>

                            </a>

                        `;

                    }
                )
                .join("");

    }


    /* ======================================
       SHOW PAGE
    ======================================= */

    $("#loading")
        .classList
        .add("hidden");

    $("#page")
        .classList
        .remove("hidden");

}


/* ==========================================
   MOVE EPISODE
========================================== */

function moveEpisode(direction) {

    const newIndex =
        currentIndex +
        direction;


    if (
        newIndex < 0 ||
        newIndex >= episodes.length
    ) {

        return;

    }


    window.location.href =
        episodeLink(
            episodes[newIndex]
        );

}


/* ==========================================
   PREVIOUS
========================================== */

$("#prev")
    .addEventListener(
        "click",
        function() {

            moveEpisode(-1);

        }
    );


/* ==========================================
   NEXT
========================================== */

$("#next")
    .addEventListener(
        "click",
        function() {

            moveEpisode(1);

        }
    );


/* ==========================================
   SUB / DUB BUTTONS
========================================== */

document
    .querySelectorAll(".lang")
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    language =
                        button.dataset.lang;

                    renderPlayer();

                }
            );

        }
    );


/* ==========================================
   KEYBOARD CONTROLS
========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const target =
            event.target;


        if (
            target &&
            (
                target.tagName ===
                    "INPUT" ||

                target.tagName ===
                    "TEXTAREA" ||

                target.tagName ===
                    "SELECT"
            )
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            moveEpisode(-1);

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            moveEpisode(1);

        }

    }
);


/* ==========================================
   LOAD ANIME JSON
========================================== */

async function init() {

    try {

        if (!animeKey) {

            throw new Error(
                "No anime specified."
            );

        }


        const response =
            await fetch(
                "data/anime/" +
                encodeURIComponent(
                    animeKey
                ) +
                ".json",
                {
                    cache:
                        "no-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Anime not found."
            );

        }


        anime =
            await response.json();


        /* ==================================
           FIND SEASON
        ================================== */

        const seasons =
            Array.isArray(
                anime.seasons
            )
                ? anime.seasons
                : [];


        season =
            seasons.find(
                function(item) {

                    return (
                        Number(
                            item.season_number
                        ) ===
                        seasonNumber
                    );

                }
            );


        if (!season) {

            season =
                seasons[0];

        }


        if (!season) {

            throw new Error(
                "Season not found."
            );

        }


        /* ==================================
           LOAD EPISODES
        ================================== */

        episodes =
            Array.isArray(
                season.episodes
            )
                ? [
                    ...season.episodes
                ]
                : [];


        episodes.sort(
            function(a, b) {

                return (
                    Number(
                        a.episode_number
                    ) -
                    Number(
                        b.episode_number
                    )
                );

            }
        );


        if (!episodes.length) {

            throw new Error(
                "No episodes found."
            );

        }


        /* ==================================
           FIND CURRENT EPISODE
        ================================== */

        const foundIndex =
            episodes.findIndex(
                function(item) {

                    return (
                        Number(
                            item.episode_number
                        ) ===
                        episodeNumber
                    );

                }
            );


        currentIndex =
            foundIndex >= 0
                ? foundIndex
                : 0;


        renderPlayer();

    }

    catch (error) {

        showError(
            error.message ||
            "Unable to load video."
        );

    }

}


/* ==========================================
   START
========================================== */

init();

</script>


</body>

</html>
